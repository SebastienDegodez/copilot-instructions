kind: plugin
ref: plugins/json-lsp
scenarios:
  - name: install-and-verify-json-server
    description: Guide the user through installing and verifying the JSON language server
    prompt: |
      I want my JSON files validated against their schema by Copilot CLI. Using the json-lsp plugin, explain how to install and verify the JSON language server.
    expectations:
      keywords:
        - "vscode-json-language-server"
        - "$schema"
    judge:
      criteria: |
        Score on:
        - Correctness: Is the exact server command and install command given?
        - Verification: Does it explain how to check the server (/lsp test json in Copilot CLI)?
        - Clarity: Are the steps actionable for both Copilot CLI and Claude Code?
      passing_score: 7.0
    timeout: 60
    runs: 2
