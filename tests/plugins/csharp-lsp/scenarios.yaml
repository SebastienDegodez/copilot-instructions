kind: plugin
ref: plugins/csharp-lsp
scenarios:
  - name: install-and-verify-csharp-ls-server
    description: Guide the user through installing and verifying the C# language server
    prompt: |
      Copilot CLI does not understand my .NET solution symbols. Using the csharp-lsp plugin, explain how to install and verify the C# language server.
    expectations:
      keywords:
        - "csharp-ls"
        - "dotnet tool install"
    judge:
      criteria: |
        Score on:
        - Correctness: Is the exact server command and install command given?
        - Verification: Does it explain how to check the server (check.sh, /lsp test csharp-ls)?
        - Clarity: Are the steps actionable for both Copilot CLI and Claude Code?
      passing_score: 7.0
    timeout: 60
    runs: 2
