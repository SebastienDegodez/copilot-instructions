kind: plugin
ref: plugins/markdown-lsp
scenarios:
  - name: install-and-verify-marksman-server
    description: Guide the user through installing and verifying the Markdown language server
    prompt: |
      I want Copilot CLI to detect broken links in my Markdown documentation. Using the markdown-lsp plugin, explain how to install and verify the Markdown language server.
    expectations:
      keywords:
        - "marksman"
        - "server"
    judge:
      criteria: |
        Score on:
        - Correctness: Is the exact server command and install command given?
        - Verification: Does it explain how to check the server (check.sh, /lsp test marksman)?
        - Clarity: Are the steps actionable for both Copilot CLI and Claude Code?
      passing_score: 7.0
    timeout: 60
    runs: 2
