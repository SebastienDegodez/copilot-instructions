kind: plugin
ref: plugins/yaml-lsp
scenarios:
  - name: install-and-verify-yaml-server
    description: Guide the user through installing and verifying the YAML language server
    prompt: |
      I want my GitHub Actions workflows validated by Copilot CLI. Using the yaml-lsp plugin, explain how to install and verify the YAML language server.
    expectations:
      keywords:
        - "yaml-language-server"
        - "$schema"
    judge:
      criteria: |
        Score on:
        - Correctness: Is the exact server command and install command given?
        - Verification: Does it explain how to check the server (/lsp test yaml in Copilot CLI)?
        - Clarity: Are the steps actionable for both Copilot CLI and Claude Code?
      passing_score: 7.0
    timeout: 60
    runs: 2
