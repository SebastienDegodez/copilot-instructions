kind: plugin
ref: plugins/typescript-lsp
scenarios:
  - name: install-and-verify-typescript-server
    description: Guide the user through installing and verifying the TypeScript & JavaScript language server
    prompt: |
      I want go-to-definition for both my .ts and .js files in Copilot CLI. Using the typescript-lsp plugin, explain how to install and verify the language server.
    expectations:
      keywords:
        - "tsc --lsp"
        - "npm install -g typescript"
    judge:
      criteria: |
        Score on:
        - Correctness: Is the exact server command and install command given?
        - Verification: Does it explain how to check the server (check.sh, /lsp test typescript)?
        - Clarity: Are the steps actionable for both Copilot CLI and Claude Code?
      passing_score: 7.0
    timeout: 60
    runs: 2
