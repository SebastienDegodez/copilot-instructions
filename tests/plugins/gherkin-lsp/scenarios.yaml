kind: plugin
ref: plugins/gherkin-lsp
scenarios:
  - name: install-and-verify-cucumber-server
    description: Guide the user through installing and verifying the Gherkin language server
    prompt: |
      I write BDD scenarios in .feature files with Reqnroll. Using the gherkin-lsp plugin, explain how to install and verify the Gherkin language server.
    expectations:
      keywords:
        - "cucumber-language-server"
        - ".feature"
    judge:
      criteria: |
        Score on:
        - Correctness: Is the exact server command and install command given?
        - Verification: Does it explain how to check the server (/lsp test cucumber in Copilot CLI)?
        - Clarity: Are the steps actionable for both Copilot CLI and Claude Code?
      passing_score: 7.0
    timeout: 60
    runs: 2
